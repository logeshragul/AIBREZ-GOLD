<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aibrez Gold - Live Market</title>
    <script>
      // Suppress Tailwind CDN warning
      (function() {
        const originalWarn = console.warn;
        console.warn = function(...args) {
          if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
          originalWarn.apply(console, args);
        };
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Dynamic Favicon (New Abstract 'A' Gold Logo) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40' fill='none'><path d='M20 4L4 36H12L20 18L28 36H36L20 4Z' fill='%23fbbf24'/><path d='M10 30H30' stroke='%23fbbf24' stroke-width='2' stroke-opacity='0.5'/></svg>" type="image/svg+xml" />
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #f8fafc; /* Slate 50 */
        color: #1e293b; /* Slate 800 */
        background-image: 
          radial-gradient(circle at 50% 0%, rgba(251, 191, 36, 0.05) 0%, transparent 50%),
          radial-gradient(circle at 100% 0%, rgba(251, 191, 36, 0.03) 0%, transparent 30%);
      }
      
      /* Ticker Animation */
      .ticker-wrap {
        width: 100%;
        overflow: hidden;
        white-space: nowrap;
      }
      .ticker {
        display: inline-block;
        animation: marquee 35s linear infinite;
      }
      @keyframes marquee {
        0% { transform: translate3d(0, 0, 0); }
        100% { transform: translate3d(-50%, 0, 0); }
      }
      
      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }
    </style>

  }
}
</script>
</head>

    <div id="root"></div>
  </body>
</html>
